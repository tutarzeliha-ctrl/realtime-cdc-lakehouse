name: order_analytics
version: "1.0.0"
config-version: 2

profile: order_analytics

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Parquet snapshot published by the CDC consumer (Project 1), relative to this folder.
  # Override for the bundled sample: --vars '{orders_snapshot_path: sample_data/orders_snapshot_sample.parquet}'
  orders_snapshot_path: "../orders_snapshot.parquet"

models:
  order_analytics:
    staging:
      +materialized: view
    marts:
      +materialized: table
