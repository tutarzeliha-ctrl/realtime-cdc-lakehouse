order_analytics:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Separate database file: dbt never opens the consumer's lakehouse.duckdb,
      # so both can run at the same time.
      path: analytics.duckdb
      threads: 1
    sample:
      type: duckdb
      # Sample data gets its own file, so its snapshot history never mixes
      # with the history recorded from the live pipeline.
      path: analytics_sample.duckdb
      threads: 1
